<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>RAGChef</title>
  <style>
    body {
      width: 360px;
      padding: 16px;
      font-family: Arial, sans-serif;
    }

    h3 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      height: 100px;
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #answer {
      margin-top: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }

    #answer .md-heading {
      margin: 12px 0 4px;
      font-size: 14px;
    }

    #answer .md-heading:first-child {
      margin-top: 0;
    }

    #answer .md-p {
      margin: 0 0 8px;
    }

    #answer ul,
    #answer ol {
      margin: 0 0 8px;
      padding-left: 20px;
    }

    #answer li {
      margin-bottom: 2px;
    }

    #intro {
      margin: 0 0 14px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #444;
    }

    #intro strong {
      color: #222;
    }
  </style>
</head>
<body>
  <h3>🍽️ RAGChef</h3>

  <div id="intro">
    <strong>🍽️ Reg Chef — Interactive Q&A 🍽️</strong><br />
    💡 End your “What should I eat today?” dilemma and make choosing meals effortless!<br />
  </div>

  <textarea id="question" placeholder="Ask a recipe question..."></textarea>

  <button id="askBtn">Ask</button>

  <div id="answer"></div>

  <script src="popup.js"></script>
</body>
</html>
